<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="icon" href="favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">

<style>:root{color-scheme:dark;background:#07080F;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mikhail Randall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: F2R brand, dark only. Two brand colors do the work: purple for actions and the name, blue for highlights. Home is a full-bleed photo slideshow. */
:root{
  color-scheme:dark;
  --bg:#07080F; --surface:#10121F; --row:#161A2E; --ink:#EEF1FF; --muted:#A7ACCA; --dim:#7C82A6; --line:#262A44;
  --brass:#8B5CF6; --navy:#8B5CF6; --tint:#1E1740; --blue:#3DE1FF; --red:#FF5A4D; --stage:#07080F; --on-stage:#EEF1FF;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:Helvetica,"Helvetica Neue","Inter",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{white-space:nowrap;font:800 clamp(19px,5.6vw,26px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.mark span{color:var(--brass)}
nav{display:flex;gap:2px;flex-wrap:nowrap}
nav a{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;text-decoration:none;color:var(--muted);padding:9px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
@media (max-width:420px){.bar-in{gap:6px}.mark{font-size:17px}nav{gap:0}nav a{font-size:12.5px;padding:7px 7px;letter-spacing:.03em}}
.mark{min-width:0;overflow:hidden;text-overflow:clip}
nav a[aria-current="page"]{color:var(--ink);background:var(--tint);box-shadow:inset 0 0 0 1px var(--brass)}
nav a .lk{width:12px;height:12px;color:var(--brass);flex:none}

.page{max-width:760px;margin:0 auto;padding-block:48px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(34px,6vw,54px);line-height:1.02;margin-top:12px}
h2{font-weight:800;font-size:22px;margin-top:40px}
.lede{font-size:19px;color:var(--muted);max-width:60ch;margin-top:16px}
p{max-width:65ch}

/* HOME: slideshow */
.stage{position:relative;background:var(--stage);color:var(--on-stage);width:100%;height:calc(100vh - var(--chrome,120px));height:calc(100svh - var(--chrome,120px));min-height:320px;overflow:hidden;display:grid}
.slide{grid-area:1/1;position:relative;opacity:0;transition:opacity 1.2s ease;display:grid;place-items:center}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}
.slide img.fill{object-fit:cover;filter:blur(28px) brightness(.45) saturate(1.1);transform:scale(1.15)}
.slide .ph{position:absolute;inset:0;background:var(--g)}
.slide .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.10),transparent 55%)}
.slide .ph b{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:500 12px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.65;text-align:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,21,.15) 30%,rgba(6,11,21,.82));pointer-events:none}
.over{z-index:2;position:absolute;left:0;right:0;bottom:0;padding-block:28px 26px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:flex-end;align-items:flex-end;gap:16px;flex-wrap:wrap}
.who{min-width:0}

.who h1{color:var(--on-stage);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(38px,9vw,92px);line-height:.92;margin-top:10px}
.cap{margin-top:12px;font-size:15px;color:rgba(243,241,234,.86);min-height:1.6em}
.ctl{display:flex;gap:8px;align-items:center}

.ctl button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,241,234,.35);background:rgba(6,11,21,.35);color:var(--on-stage);font:600 16px/1 var(--body);cursor:pointer}
.ctl button:hover{background:rgba(243,241,234,.15)}
.dots{z-index:2;position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:flex-end;gap:4px}
.dots i{flex:0 1 22px;min-width:4px;height:3px;border-radius:2px;background:rgba(243,241,234,.3)}
.dots i.on{background:var(--blue)}
.home-note{max-width:1100px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--ink);font:800 22px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em}

/* RESUME: service-record style timeline */
.rec{margin-top:20px;border-left:2px solid var(--line);padding-left:20px;display:grid;gap:22px}
.row{position:relative}
.row::before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--brass)}
.when{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--brass);font-variant-numeric:tabular-nums}
.row h3{font:800 18px/1.25 var(--display);font-stretch:112%;margin:6px 0 2px}
.row .org{color:var(--muted);font-size:15px}
.row p{margin:6px 0 0}
.todo{color:var(--brass);font-family:var(--mono);font-size:13px}

/* DAY2DAY gate */
.gate{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px}
.gate label{font-weight:600;font-size:14px}
.gate .in{display:flex;gap:8px;margin-top:10px}
.gate input{flex:1;min-width:0;font:600 18px/1 var(--mono);letter-spacing:.2em;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:700 15px/1 var(--body);padding:13px 18px;border-radius:10px;border:0;background:var(--brass);color:#EEF1FF;cursor:pointer;text-decoration:none;display:inline-block}
.msg{margin-top:10px;font-size:14px;min-height:1.4em;color:var(--muted)}
.msg.bad{color:var(--red)}
.open{margin-top:6px}
footer{color:var(--muted);font-size:13px}
footer div{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;max-width:1100px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer .mail{color:var(--blue);text-decoration:none}
footer .mail:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
/* Music under the slideshow */
.music{max-width:900px;margin:0 auto;padding-block:20px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spot{display:block;width:100%;height:352px;border:0;border-radius:14px;background:var(--surface)}
/* Phone: full-width photo, arrows centered underneath */
@media (max-width:700px){.stage{height:auto;min-height:0;aspect-ratio:3/2;overflow:visible;margin-bottom:68px}.slide img{object-fit:cover}.slide img.fill{display:none}
.over{top:100%;bottom:auto;padding-block:12px;justify-content:center}.ctl button{background:var(--surface);border-color:var(--line)}}
</style>

</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="mark" href="#home">Mikhail <span>Randall</span></a>
  <nav aria-label="Site">
    <a href="#home" data-tab="home">Home</a>
    <a href="#day2day" data-tab="day2day">Day2Day<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="locked" role="img"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></a>
  </nav>
</div></header>

<main>
<section id="v-home" data-view="home">
  <div class="stage" id="stage" aria-roledescription="carousel" aria-label="My people">
    <div class="dots" id="dots"></div>
    <h1 class="sr">Mikhail Randall</h1>
    <div class="over">
      <div class="ctl">
        <button type="button" id="prev" aria-label="Previous photo">‹</button>
        <button type="button" id="next" aria-label="Next photo">›</button>
      </div>
    </div>
  </div>
</section>



<section id="v-day2day" data-view="day2day" class="page" hidden>
  <div class="eyebrow">Private</div>
  <h1>Day2Day</h1>
  <p class="lede">My personal HQ. Enter the code to get in.</p>
  <form class="gate" id="gate" autocomplete="off">
    <label for="code">Code</label>
    <div class="in"><input id="code" type="password" inputmode="text" autocomplete="off"><button class="btn" type="submit">Enter</button></div>
    <div class="msg" id="msg"></div>
    <div class="open" id="open" hidden><a class="btn" href="https://claude.ai/artifact/G3gHqZaFAp7VwXnGyJQLPS" target="_blank" rel="noopener">Open Day2Day →</a></div>
  </form>
</section>
</main>

<footer><div><span>© 2026 Randall Holdings LLC</span></div></footer>

<script>
/* Photos live in photos/. Order is shuffled on every visit. */
const PHOTOS=[
  {src:"photos/01.jpg",alt:"A tabby cat and a small black dog on a couch"},
  {src:"photos/02.jpg",alt:"A couple smiling in a sunny beer garden"},
  {src:"photos/03.jpg",alt:"A couple on a dock at sunset"},
  {src:"photos/04.jpg",alt:"A selfie by the water on a cloudy day"},
  {src:"photos/05.jpg",alt:"A man in his kitchen holding a small dog"},
  {src:"photos/06.jpg",alt:"A late-night selfie"},
  {src:"photos/07.jpg",alt:"Dancing by the Christmas tree"},
  {src:"photos/08.jpg",alt:"A kiss on the cheek on the couch"},
  {src:"photos/09.jpg",alt:"Holding a baby at a restaurant booth"},
  {src:"photos/10.jpg",alt:"A selfie under palm trees by the water"},
  {src:"photos/11.jpg",alt:"Smiling with a gray cat"},
  {src:"photos/12.jpg",alt:"At the blackjack table"},
  {src:"photos/13.jpg",alt:"Family together at a holiday party"},
  {src:"photos/14.jpg",alt:"Bowling night"},
  {src:"photos/15.jpg",alt:"Hugging the Christmas tree"},
  {src:"photos/16.jpg",alt:"A smile under a green beanie"},
  {src:"photos/17.jpg",alt:"Holding the dog by a lake in the woods"}
];
/* Random order every visit */
for(let i=PHOTOS.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [PHOTOS[i],PHOTOS[j]]=[PHOTOS[j],PHOTOS[i]]; }
const PLACEHOLDERS=[
  {g:"linear-gradient(135deg,#1C3260,#0B1424)",cap:"Photo 1 · add your first favorite"},
  {g:"linear-gradient(135deg,#5B4A1A,#13284A)",cap:"Photo 2 · add your next one"},
  {g:"linear-gradient(135deg,#243B2E,#0B1424)",cap:"Photo 3 · and the next"}
];
const slides=PHOTOS.length?PHOTOS:PLACEHOLDERS;
const stage=document.getElementById('stage'), dots=document.getElementById('dots'), cap=null;
slides.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide'+(i?'':' on'); d.setAttribute('aria-roledescription','slide');
  if(s.src){ const bg=new Image(); bg.src=s.src; bg.alt=''; bg.className='fill'; bg.setAttribute('aria-hidden','true'); bg.loading=i?'lazy':'eager'; d.appendChild(bg);
    const im=new Image(); im.src=s.src; im.alt=s.alt||''; im.loading=i?'lazy':'eager'; d.appendChild(im); }
  else { const p=document.createElement('div'); p.className='ph'; p.style.setProperty('--g',s.g); const b=document.createElement('b'); b.textContent='Example slide'; p.appendChild(b); d.appendChild(p); }
  stage.insertBefore(d,stage.querySelector('.over'));
  dots.appendChild(document.createElement('i'));
});
let cur=0, timer=null, playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(n){ const els=stage.querySelectorAll('.slide'); cur=(n+els.length)%els.length;
  els.forEach((e,i)=>e.classList.toggle('on',i===cur)); dots.querySelectorAll('i').forEach((e,i)=>e.classList.toggle('on',i===cur));
  }
function tick(){ clearInterval(timer); if(playing) timer=setInterval(()=>show(cur+1),5000);
}
document.getElementById('prev').onclick=()=>{ show(cur-1); tick(); };
document.getElementById('next').onclick=()=>{ show(cur+1); tick(); };
let sx=null; stage.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ show(cur+(dx<0?1:-1)); tick(); } sx=null; });
show(0); tick();

/* Stage fills the screen between header and footer */
function chrome(){ const h=document.querySelector('.bar'), f=document.querySelector('footer'); document.documentElement.style.setProperty('--chrome',((h?h.offsetHeight:0)+(f?f.offsetHeight:0))+'px'); }
addEventListener('resize',chrome); chrome();
/* Tabs */
const TABS=['home','day2day'];
function route(){ const t=TABS.includes(location.hash.slice(1))?location.hash.slice(1):'home';
  document.querySelectorAll('[data-view]').forEach(v=>v.hidden=v.dataset.view!==t);
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0); }
addEventListener('hashchange',route); route();

/* Day2Day code. The real lock is the Claude login: the app only opens for Kail's account. */
const CODE_HASH='19a0098e641d4bee278bb5d470d06679ffc5fdc818c3a1c52bfb7f8cde3752d3';
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function unlock(){ document.getElementById('open').hidden=false; const m=document.getElementById('msg'); m.className='msg'; m.textContent='Unlocked.'; }
try{ if(sessionStorage.getItem('d2d')==='1') unlock(); }catch(_){}
document.getElementById('gate').addEventListener('submit',async e=>{ e.preventDefault();
  const v=document.getElementById('code').value.trim().toLowerCase(), m=document.getElementById('msg');
  if(!v){ m.className='msg bad'; m.textContent='Type the code first.'; return; }
  if(await sha(v)===CODE_HASH){ unlock(); try{ sessionStorage.setItem('d2d','1'); }catch(_){} }
  else { m.className='msg bad'; m.textContent='That code didn’t match. Try again.'; document.getElementById('open').hidden=true; } });
</script>

</body>
</html>
